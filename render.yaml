services:
  - type: web
    name: gem-bidwatch
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONITOR_ENABLED
        value: "true"
      - key: GEM_POLL_INTERVAL_SECONDS
        value: "300"
